function connection(c){conn=c;c.on('open',()=>{other.online=true;$('net').textContent=host?'상대 접속! 게임 시작':'접속 성공, 호스트 시작 대기';if(host){race=true;send({type:'go',mode});start()}else send({type:'ready'})});c.on('data',d=>{if(d.type==='go'&&!host){mode=d.mode==='coop'?'coop':'race';$('mode').value=mode;race=true;start()}if(d.type==='shot'&&race&&Number.isFinite(d.x)&&Number.isFinite(d.y))cueShot(Math.max(0,Math.min(1,d.x)),Math.max(0,Math.min(1,d.y)));if(d.type==='state'){other.online=true;if(Array.isArray(d.aim)&&d.aim.length===2){remoteCursor={x:d.aim[0],y:d.aim[1],t:performance.now()};$('remoteAim').style.left=remoteCursor.x*100+'%';$('remoteAim').style.top=remoteCursor.y*100+'%'}other.progress=d.progress;other.score=d.score;other.time=d.time;if(mode==='coop'&&!host&&Array.isArray(d.positions))d.positions.forEach((p,i)=>{let e=enemies[i];if(e&&p){e.position.z=p[0];e.userData.hp=p[1];e.userData.alive=p[2]}})}if(mode==='coop'&&host&&d.type==='hit'&&Number.isInteger(d.index)&&d.index>=0&&d.index<enemies.length&&['head','body','limb'].includes(d.kind)){let e=enemies[d.index];applyDamage(e,d.kind);send({type:'enemy',index:d.index,hp:e.userData.hp,alive:e.userData.alive})}if(mode==='coop'&&!host&&d.type==='enemy'){let e=enemies[d.index];if(e){e.userData.hp=d.hp;e.userData.alive=d.alive;e.userData.flinch=.2}}if(mode==='coop'&&!host&&d.type==='wave'&&d.stage===stage+1){branch=d.branch===1?1:0;goal=11-12*(d.stage-1);addWaveFromHost()}if(mode==='coop'&&!host&&d.type==='clear'&&running)end(true);if(d.type==='finish'){other.done=true;other.won=d.won;other.time=d.time;other.score=d.score;other.progress=d.won?1:other.progress;result()}});c.on('close',()=>{other.online=false;$('remoteAim').style.display='none';$('net').textContent='상대 연결 종료'})}
function addWaveFromHost(){let wasHost=host;host=true;addWave();host=wasHost}async function getPeer(){if(window.Peer)return window.Peer;return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js';s.onload=()=>resolve(window.Peer);s.onerror=reject;document.head.append(s)})}
