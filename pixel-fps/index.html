<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIXEL BREACH — 2D FPS</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b10;color:#e5f2f1;font:14px system-ui,Arial;overflow:hidden}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;cursor:crosshair}#hud{position:fixed;inset:0;pointer-events:none}#top{position:absolute;top:20px;left:22px;display:flex;gap:10px;flex-wrap:wrap}.chip{background:#08141bdc;border:1px solid #42606c;padding:10px 15px;letter-spacing:1px}#status{position:absolute;bottom:24px;left:24px;background:#07151ce8;border:1px solid #3c5c65;padding:14px 20px;font-weight:700}#ammo{font-size:24px;color:#f9d480}#cross{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px;color:#eff7fa;text-shadow:0 0 5px #000}#msg{position:absolute;top:18%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;text-shadow:0 2px 8px black;white-space:nowrap}#menu{position:absolute;inset:0;background:#050c13df;display:grid;place-items:center;text-align:center;pointer-events:auto}#panel{max-width:640px;padding:35px}h1{font-size:clamp(44px,8vw,90px);line-height:1;margin:0;color:#f2be68;letter-spacing:5px}p{line-height:1.9;color:#bbced0}button{background:#db814b;color:#101319;border:0;padding:16px 30px;margin:15px 0;font-size:18px;font-weight:bold;cursor:pointer}a{color:#b7dbe3;text-decoration:none}.small{font-size:12px;color:#9cb6bd}#hit{position:absolute;inset:0;background:#e72736;opacity:0;transition:opacity .11s}@media(max-width:600px){#top{top:6px;left:6px}.chip{padding:6px 8px;font-size:11px}#status{bottom:8px;left:8px;padding:8px}#ammo{font-size:18px}}
</style></head><body>
<canvas id="view"></canvas><div id="hud"><div id="hit"></div><div id="top"><div class="chip" id="wave">WAVE 1</div><div class="chip" id="score">SCORE 0</div><div class="chip" id="kills">KILLS 0</div></div><div id="cross">+</div><div id="msg"></div><div id="status"><span id="health">HP 100</span>　<span id="ammo">12 / ∞</span>　<span id="reload">PISTOL</span></div></div>
<div id="menu"><div id="panel"><p>RETRO RAYCAST SHOOTER</p><h1>PIXEL<br>BREACH</h1><p>2D 맵과 픽셀 스프라이트로 구현한 1인칭 FPS.<br>엄폐물을 활용하고, 추격하는 감염체를 막아내세요.</p><p>WASD 이동 · 마우스 시점 · 좌클릭 사격 · R 재장전<br>Shift 달리기 · 1 권총 / 2 자동소총 · M 미니맵</p><button id="start">작전 시작</button><p class="small">클릭하면 마우스가 고정됩니다 · ESC 일시정지</p><a href="../index.html">← 게임 선택 화면</a></div></div>
<script>
'use strict';
const cvs=document.getElementById('view'),g=cvs.getContext('2d',{alpha:false});
const out={wave:document.getElementById('wave'),score:document.getElementById('score'),kills:document.getElementById('kills'),health:document.getElementById('health'),ammo:document.getElementById('ammo'),reload:document.getElementById('reload'),msg:document.getElementById('msg'),hit:document.getElementById('hit')};
const MAP=[
"11111111111111111111",
"10000000001000000001",
"10110000000000110001",
"10000011000000000001",
"10000000000000000001",
"10001100000011000001",
"10000000000000000001",
"11000000000000001101",
"10000011000000000001",
"10000000000000000001",
"10001000000001000001",
"10000000000000000001",
"10110000000000110001",
"10000001000000000001",
"10000000000000000001",
"11111111111111111111"
];
const MH=MAP.length,MW=MAP[0].length,TAU=Math.PI*2,FOV=Math.PI/2.9;
const wall=(x,y)=>{let ix=Math.floor(x),iy=Math.floor(y);return ix<0||iy<0||iy>=MH||ix>=MW||MAP[iy][ix]==='1'};
const rand=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let W=640,H=360,z=[],last=0,now=0,frame=0,fireHeld=false,active=false,over=false,showMap=true;
let keys={},p,enemies=[],particles=[],wave=0,score=0,kills=0,shake=0,flash=0,recoil=0,shotClock=0,noticeUntil=0;
const guns=[{name:'PISTOL',max:12,rate:.25,dmg:37,reload:1.12,spread:.015},{name:'ASSAULT',max:30,rate:.087,dmg:16,reload:1.7,spread:.036}];
let weapon=0,ammo=[12,30],reloadUntil=0;
const audio=new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type='square',vol=.075){if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*.3),audio.currentTime+dur);v.gain.setValueAtTime(vol,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(v);v.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function resize(){let sc=Math.max(1,Math.min(3,Math.floor(window.innerWidth/560)));W=Math.max(320,Math.floor(innerWidth/sc));H=Math.max(200,Math.floor(innerHeight/sc));cvs.width=W;cvs.height=H;g.imageSmoothingEnabled=false;z=new Float32Array(W)}addEventListener('resize',resize);resize();
function reset(){p={x:3.5,y:3.5,a:.14,hp:100,bob:0};wave=0;score=0;kills=0;enemies=[];particles=[];ammo=[12,30];weapon=0;reloadUntil=0;over=false;active=true;spawnWave();updateHUD()}
function clearPos(x,y,r=.19){return !wall(x-r,y-r)&&!wall(x+r,y-r)&&!wall(x-r,y+r)&&!wall(x+r,y+r)}
function move(e,dx,dy,r=.2){if(clearPos(e.x+dx,e.y,r))e.x+=dx;if(clearPos(e.x,e.y+dy,r))e.y+=dy}
function spawnWave(){wave++;let n=Math.min(6+wave*2,32);for(let i=0;i<n;i++){for(let j=0;j<70;j++){let x=rand(1,MW-1),y=rand(1,MH-1);if(clearPos(x,y,.27)&&Math.hypot(x-p.x,y-p.y)>4){enemies.push({x,y,hp:wave<3?65:80+wave*8,speed:rand(.37,.53)+wave*.023,attack:rand(0,1),phase:rand(0,TAU),hurt:0});break}}}message('WAVE '+wave+' · 적 '+n+'명',2);beep(220,.25,'sawtooth',.04)}
function message(s,sec=1){out.msg.textContent=s;noticeUntil=now+sec}
function updateHUD(){out.wave.textContent='WAVE '+wave;out.score.textContent='SCORE '+score;out.kills.textContent='KILLS '+kills;out.health.textContent='HP '+Math.max(0,Math.ceil(p.hp));out.ammo.textContent=ammo[weapon]+' / ∞';out.reload.textContent=now<reloadUntil?'RELOADING...':guns[weapon].name;out.health.style.color=p.hp<35?'#ff6262':'#e5f2f1'}
function lineOfSight(x1,y1,x2,y2){let len=Math.hypot(x2-x1,y2-y1),steps=Math.ceil(len/.07);for(let i=1;i<steps;i++)if(wall(x1+(x2-x1)*i/steps,y1+(y2-y1)*i/steps))return false;return true}
function shoot(){let w=guns[weapon];if(!active||now<shotClock||now<reloadUntil)return;if(ammo[weapon]===0){reload();return}ammo[weapon]--;shotClock=now+w.rate;flash=.12;shake=5;recoil=10;beep(weapon?100:160,.14,'sawtooth',.15);let candidates=enemies.filter(e=>e.hp>0&&lineOfSight(p.x,p.y,e.x,e.y)).map(e=>{let a=Math.atan2(e.y-p.y,e.x-p.x)-p.a;a=Math.atan2(Math.sin(a),Math.cos(a));return {e,d:dist(p,e),a}}).filter(t=>Math.abs(t.a)<Math.atan2(.27,t.d)+w.spread).sort((a,b)=>a.d-b.d);if(candidates.length){let e=candidates[0].e,d=candidates[0].d;let damage=Math.round(w.dmg*(d<2?1.25:1));e.hp-=damage;e.hurt=.15;score+=5;for(let i=0;i<9;i++)particles.push({x:e.x,y:e.y,life:rand(.2,.5)});if(e.hp<=0){kills++;score+=100;beep(330,.08,'triangle');if(Math.random()<.13)p.hp=Math.min(100,p.hp+12)}}if(ammo[weapon]===0)reload();updateHUD()}
function reload(){if(now<reloadUntil||ammo[weapon]===guns[weapon].max||!active)return;reloadUntil=now+guns[weapon].reload;message('RELOADING',.55);beep(580,.08,'triangle',.035)}
function update(dt){if(!active)return;let speed=(keys.ShiftLeft||keys.ShiftRight?3.75:2.6),f=(+!!keys.KeyW)-(+!!keys.KeyS),s=(+!!keys.KeyD)-(+!!keys.KeyA),len=Math.hypot(f,s)||1;move(p,(Math.cos(p.a)*f-Math.sin(p.a)*s)/len*speed*dt,(Math.sin(p.a)*f+Math.cos(p.a)*s)/len*speed*dt,.2);p.bob+=(f||s?dt*speed*8:dt*2);if(keys.ArrowLeft)p.a-=2.5*dt;if(keys.ArrowRight)p.a+=2.5*dt;if(fireHeld)shoot();if(reloadUntil&&now>=reloadUntil){ammo[weapon]=guns[weapon].max;reloadUntil=0;beep(720,.07,'triangle',.04)}for(const e of enemies){if(e.hp<=0)continue;e.hurt=Math.max(0,e.hurt-dt);const d=dist(e,p);e.attack-=dt;if(d>.62){let dx=(p.x-e.x)/d*e.speed*dt,dy=(p.y-e.y)/d*e.speed*dt;move(e,dx,dy,.23)}else if(e.attack<=0){e.attack=rand(.8,1.3);p.hp-=rand(7,12);shake=8;out.hit.style.opacity='.31';setTimeout(()=>out.hit.style.opacity='0',100);beep(65,.17,'sawtooth',.2);if(p.hp<=0)die()}}enemies=enemies.filter(e=>e.hp>0);for(const a of particles)a.life-=dt;particles=particles.filter(a=>a.life>0);if(!enemies.length)spawnWave();shake=Math.max(0,shake-dt*19);flash=Math.max(0,flash-dt);recoil=Math.max(0,recoil-dt*48);if(now>noticeUntil)out.msg.textContent='';updateHUD()}
function die(){active=false;over=true;document.exitPointerLock?.();document.getElementById('menu').style.display='grid';document.querySelector('#panel h1').innerHTML='MISSION<br>FAILED';document.querySelector('#panel p:nth-of-type(2)').innerHTML='WAVE '+wave+' · 처치 '+kills+' · 점수 '+score;document.getElementById('start').textContent='다시 도전';fireHeld=false}
function render(){const ox=shake?rand(-shake,shake):0,oy=shake?rand(-shake,shake):0;g.save();g.translate(ox,oy);
let sky=g.createLinearGradient(0,0,0,H/2);sky.addColorStop(0,'#152638');sky.addColorStop(1,'#546376');g.fillStyle=sky;g.fillRect(-20,-20,W+40,H/2+20);let floor=g.createLinearGradient(0,H/2,0,H);floor.addColorStop(0,'#303839');floor.addColorStop(1,'#111a1a');g.fillStyle=floor;g.fillRect(-20,H/2,W+40,H);
const halfTan=Math.tan(FOV/2);
for(let x=0;x<W;x+=2){let cameraX=(2*(x+.5)/W-1)*halfTan,rayA=p.a+Math.atan(cameraX),dx=Math.cos(rayA),dy=Math.sin(rayA),mapX=Math.floor(p.x),mapY=Math.floor(p.y),deltaX=Math.abs(1/dx),deltaY=Math.abs(1/dy);let stepX=dx<0?-1:1,stepY=dy<0?-1:1,sideX=(dx<0?p.x-mapX:mapX+1-p.x)*deltaX,sideY=(dy<0?p.y-mapY:mapY+1-p.y)*deltaY,side=0,d=30;for(let j=0;j<36;j++){if(sideX<sideY){mapX+=stepX;d=sideX;sideX+=deltaX;side=0}else{mapY+=stepY;d=sideY;sideY+=deltaY;side=1}if(wall(mapX+.1,mapY+.1))break}d=Math.max(.08,d*Math.cos(rayA-p.a));z[x]=z[x+1]=d;let ht=Math.min(H*3,H/d*.9),start=(H-ht)/2,shade=Math.max(.15,1-d/15)*(side?.7:1);let edge=side?((p.x+d*dx)%1):((p.y+d*dy)%1);const brick=(Math.floor(edge*7)%2===0)?1:.79;g.fillStyle='rgb('+Math.floor(85*shade*brick)+','+Math.floor(142*shade*brick)+','+Math.floor(155*shade*brick)+')';g.fillRect(x,start,2,ht);g.fillStyle='rgba(0,0,0,.16)';for(let t=0;t<ht;t+=Math.max(5,ht/4))g.fillRect(x,start+t,2,Math.max(1,ht/60));}
const visible=enemies.map(e=>({...e,d:dist(p,e)})).sort((a,b)=>b.d-a.d);
for(const e of visible){let ang=Math.atan2(e.y-p.y,e.x-p.x)-p.a;ang=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(ang)>FOV/2+.3||e.d<.15)continue;let perp=e.d*Math.cos(ang),sx=(.5+Math.tan(ang)/(2*halfTan))*W,h=H/Math.max(.2,perp)*.68,sw=h*.55;if(h>H*8)continue;let col=e.hurt?'#ffffdd':'#ac4a43';let bob=Math.sin(now*6+e.phase)*Math.min(3,h*.03),y=H/2+h*.12+bob;for(let xx=Math.max(0,Math.floor(sx-sw/2));xx<Math.min(W,sx+sw/2);xx+=2){if(z[xx]<perp-.25)continue;let u=(xx-sx)/sw+.5;if(u<0||u>1)continue;g.fillStyle='#251d25';g.fillRect(xx,y-h*.44,2,h*.71);g.fillStyle=col;if(u>.14&&u<.86)g.fillRect(xx,y-h*.42,2,h*.58);let headR=Math.sqrt(Math.max(0,1-(u-.5)**2*4));g.fillStyle=e.hurt?'#ffffbb':'#a4bbaa';g.fillRect(xx,y-h*.84+(1-headR)*h*.19,2,headR*h*.29);if((u>.27&&u<.4)||(u>.6&&u<.73)){g.fillStyle='#ff3232';g.fillRect(xx,y-h*.68,2,Math.max(2,h*.04))}g.fillStyle='#161923';if(u>.2&&u<.4||u>.6&&u<.8)g.fillRect(xx,y+h*.15,2,h*.27)}}
let bob=Math.sin(p.bob)*((keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD)?4:1),gx=W/2,gy=H+H*.05+bob+recoil;g.fillStyle='#101820';g.beginPath();g.moveTo(gx-75,gy);g.lineTo(gx-46,gy-65);g.lineTo(gx-20,gy-76);g.lineTo(gx-12,gy-144);g.lineTo(gx+12,gy-144);g.lineTo(gx+20,gy-76);g.lineTo(gx+46,gy-65);g.lineTo(gx+75,gy);g.fill();g.fillStyle='#526773';g.fillRect(gx-10,gy-155,20,83);g.fillStyle='#2c3f48';g.fillRect(gx-35,gy-75,70,66);g.fillStyle='#101419';g.fillRect(gx-13,gy-119,26,21);if(flash>0){g.fillStyle='#fff0a2';g.beginPath();g.moveTo(gx-22,gy-153);g.lineTo(gx,gy-215-rand(0,20));g.lineTo(gx+22,gy-153);g.fill()}if(showMap){let scale=Math.max(5,Math.min(10,W/65)),mx=10,my=46;g.fillStyle='#05131bdc';g.fillRect(mx-5,my-5,MW*scale+10,MH*scale+10);for(let yy=0;yy<MH;yy++)for(let xx=0;xx<MW;xx++){g.fillStyle=MAP[yy][xx]==='1'?'#49636e':'#1b3137';g.fillRect(mx+xx*scale,my+yy*scale,scale-1,scale-1)}for(const e of enemies){g.fillStyle='#ed6c57';g.fillRect(mx+e.x*scale-2,my+e.y*scale-2,4,4)}g.fillStyle='#e7e5ad';g.beginPath();g.arc(mx+p.x*scale,my+p.y*scale,3,0,TAU);g.fill();g.strokeStyle='#efffd3';g.beginPath();g.moveTo(mx+p.x*scale,my+p.y*scale);g.lineTo(mx+(p.x+Math.cos(p.a)*.8)*scale,my+(p.y+Math.sin(p.a)*.8)*scale);g.stroke()}}g.restore()}
function loop(ms){now=ms/1000;let dt=Math.min(.04,(ms-last)/1000||.016);last=ms;update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('start').addEventListener('click',()=>{if(over||wave===0)reset();else active=true;document.getElementById('menu').style.display='none';audio.resume();cvs.requestPointerLock?.()});
cvs.addEventListener('click',()=>{if(active&&document.pointerLockElement!==cvs)cvs.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&active){active=false;fireHeld=false;document.querySelector('#panel h1').innerHTML='PAUSED';document.querySelector('#panel p:nth-of-type(2)').textContent='일시정지';document.getElementById('start').textContent='계속하기';document.getElementById('menu').style.display='grid'}});
document.addEventListener('mousemove',e=>{if(active&&document.pointerLockElement===cvs)p.a+=e.movementX*.0025});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyR')reload();if(e.code==='Digit1'||e.code==='Digit2'){weapon=e.code==='Digit1'?0:1;reloadUntil=0}if(e.code==='KeyM')showMap=!showMap});
document.addEventListener('keyup',e=>{keys[e.code]=false});
document.addEventListener('mousedown',e=>{if(e.button===0&&active)fireHeld=true});document.addEventListener('mouseup',()=>fireHeld=false);addEventListener('blur',()=>{keys={};fireHeld=false});
</script></body></html>
