<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>덕후 소울 — Combat Test</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="hud">
    <div id="brand">덕후 소울 <small>COMBAT PROTOTYPE</small></div>
    <div class="bar"><span>HP</span><i id="hp"></i></div>
    <div class="bar posture"><span>POSTURE</span><i id="posture"></i></div>
    <div id="boss">
      <b>갑각참수룡 · 시련 개체</b>
      <div class="bossbar"><i id="bossHp"></i></div>
      <div class="bossbar posture"><i id="bossPosture"></i></div>
      <div id="parts">머리 <em id="headPart">정상</em> · 앞발 <em id="legPart">정상</em> · 꼬리 <em id="tailPart">정상</em></div>
    </div>
    <div id="weaponHud">1. 직검 · 한손/방패 가드</div>\n    <div id="danger">危</div>
    <div id="hint">WASD 이동 · Shift 달리기 · Space 8방향 구르기 · LMB 공격 · RMB 가드/패링 · 1~6 무기 선택 · T 한손/양손 · Q 락온</div>
    <div id="message"></div>
  </div>
  <canvas id="game"></canvas>
  <script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
  <script type="module" src="./main.js"></script>
</body>
</html>
