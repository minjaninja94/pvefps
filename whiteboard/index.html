<body>
<div id="boot-error" style="padding:24px;font:14px/1.6 system-ui;color:#222">
  화이트보드를 불러오는 중입니다. 잠시만 기다려주세요.
</div>
<div id="root"></div>
<script type="module">
(async function bootWhiteboard() {
  const errorBox = document.getElementById("boot-error");
  function showRuntimeError(title, detail) {
    errorBox.style.display = "block";
    errorBox.replaceChildren();
    const heading = document.createElement("h2");
    heading.textContent = title;
    const paragraph = document.createElement("p");
    paragraph.textContent = "오류 내용을 복사하거나 화면을 캡처해 보내주세요.";
    const pre = document.createElement("pre");
    pre.style.cssText = "white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:12px;border-radius:8px";
    pre.textContent = String(detail || "원인을 확인할 수 없는 오류");
    errorBox.append(heading, paragraph, pre);
  }
  window.addEventListener("error", function(event) {
    showRuntimeError("화이트보드 실행 중 오류가 발생했습니다.", event.error && (event.error.stack || event.error.message) || event.message);
  });
  window.addEventListener("unhandledrejection", function(event) {
    const reason = event.reason;
    showRuntimeError("화이트보드 내부 작업이 중단되었습니다.", reason && (reason.stack || reason.message) || reason);
  });
  try {
  // Keep Excalidraw, ReactDOM, and the application on one shared React 18 module graph.
  const React = await import("https://esm.sh/react@18.3.1");
  const ReactDOMClient = await import("react-dom/client");
  const ExcalidrawLib = await import("https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.js?external=react,react-dom");
  let sharedPayload = null;
  try {
    const match = window.location.hash.match(/(?:^#|&)shared=([^&]+)/);
    if (match) {
      let encoded = match[1].replace(/-/g, "+").replace(/_/g, "/");
      encoded += "=".repeat((4 - encoded.length % 4) % 4);
      const decoded = decodeURIComponent(escape(atob(encoded)));
      const parsed = JSON.parse(decoded);
      if (parsed && parsed.type === "excalidraw" && parsed.document && Array.isArray(parsed.document.elements)) sharedPayload = parsed;
    }
  } catch (shareError) {
    console.warn("Invalid shared drawing link:", shareError);
  }
  const sharedDoc = sharedPayload ? {
    id: "shared-" + crypto.randomUUID(),
    title: sharedPayload.title || "공유 드로잉",
    document: sharedPayload.document,
    cloudName: "",
    cloudSha: "",
    updatedAt: Date.now()
  } : null;
  const createRoot = ReactDOMClient.createRoot;
  if (!React || !createRoot || !ExcalidrawLib.Excalidraw) {
    throw new Error("필수 모듈을 불러왔지만 Excalidraw 구성 요소를 찾을 수 없습니다.");
  }
  errorBox.style.display = "none";

  const h = React.createElement;
  const DB_NAME = "pvefps-whiteboard";
  const STORE = "drawings";
  const CONFIG_KEY = "pvefps-whiteboard-config";
  let dbPromise;

  function openDb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function(resolve, reject) {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = function() {
        if (!request.result.objectStoreNames.contains(STORE)) request.result.createObjectStore(STORE, { keyPath: "id" });
      };
      request.onsuccess = function() { resolve(request.result); };
      request.onerror = function() { reject(request.error); };
    });
    return dbPromise;
  }
  async function dbAll() {
    const db = await openDb();
    return new Promise(function(resolve, reject) {
      const request = db.transaction(STORE, "readonly").objectStore(STORE).getAll();
      request.onsuccess = function() { resolve(request.result || []); };
      request.onerror = function() { reject(request.error); };
    });
  }
  async function dbPut(doc) {
    const db = await openDb();
    return new Promise(function(resolve, reject) {
      const request = db.transaction(STORE, "readwrite").objectStore(STORE).put(doc);
      request.onsuccess = function() { resolve(); };
      request.onerror = function() { reject(request.error); };
    });
  }
  async function dbDelete(id) {
    const db = await openDb();
    return new Promise(function(resolve, reject) {
      const request = db.transaction(STORE, "readwrite").objectStore(STORE).delete(id);
      request.onsuccess = function() { resolve(); };
      request.onerror = function() { reject(request.error); };
    });
  }
  function newDocument(title) {
    const id = crypto.randomUUID();
    return {
      id: id,
      title: title || "새 드로잉",
      cloudName: "",
      cloudSha: "",
      desiredCloudName: "",
      updatedAt: Date.now(),
      document: {
        type: "excalidraw",
        version: 2,
        source: "https://excalidraw.com",
        elements: [],
        appState: { viewBackgroundColor: "#ffffff", gridSize: null },
        files: {}
      }
    };
  }
  function safeName(value, fallback) {
    const normalized = String(value || "").normalize("NFKD").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 64);
    return normalized || fallback;
  }
  function configRead() {
    try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "{}"); } catch (_) { return {}; }
  }
  async function requestCloud(config, path, method, body) {
    if (!config.endpoint || !config.key) throw new Error("GitHub 동기화 설정이 필요합니다.");
    const response = await fetch(config.endpoint.replace(/\/+$/, "") + path, {
      method: method || "GET",
      headers: {
        "Authorization": "Bearer " + config.key,
        ...(body ? { "Content-Type": "application/json" } : {})
      },
      body: body ? JSON.stringify(body) : undefined
    });
    const data = await response.json().catch(function() { return {}; });
    if (!response.ok) throw new Error(data.error || "동기화에 실패했습니다. (" + response.status + ")");
    return data;
  }
  function downloadText(filename, text) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  }

  function App() {
    const [docs, setDocs] = React.useState([]);
    const [folderFilter, setFolderFilter] = React.useState("");
    const [activeId, setActiveId] = React.useState("");
    const [activeDoc, setActiveDoc] = React.useState(null);
    const [status, setStatus] = React.useState("로컬 저장소 확인 중");
    const [statusKind, setStatusKind] = React.useState("");
    const [cloudItems, setCloudItems] = React.useState([]);
    const [config, setConfig] = React.useState(configRead());
    const [showSettings, setShowSettings] = React.useState(false);
    const [endpointDraft, setEndpointDraft] = React.useState(config.endpoint || "");
    const [keyDraft, setKeyDraft] = React.useState(config.key || "");
    const [toast, setToast] = React.useState("");
    const localTimer = React.useRef(null);
    const cloudTimer = React.useRef(null);
    const activeRef = React.useRef(null);
    const canvasApiRef = React.useRef(null);
    const lastCloudFingerprint = React.useRef("");
    const cloudBusy = React.useRef(false);
    const cloudQueued = React.useRef([]);
    const [busy, setBusy] = React.useState(false);

    React.useEffect(function() {
      let alive = true;
      if (sharedDoc) {
        activeRef.current = sharedDoc;
        setDocs([sharedDoc]); setActiveId(sharedDoc.id); setActiveDoc(sharedDoc);
        setStatus("읽기 전용 공유 문서"); setStatusKind("ok");
        return function() { alive = false; };
      }
      dbAll().then(async function(items) {
        if (!alive) return;
        const sorted = items.sort(function(a,b) { return b.updatedAt - a.updatedAt; });
        if (sorted.length) {
          setDocs(sorted);
          setActiveId(sorted[0].id);
          setActiveDoc(sorted[0]);
          setStatus("이 기기 로컬 저장 완료");
          setStatusKind("ok");
        } else {
          const doc = newDocument("첫 번째 드로잉");
          await dbPut(doc);
          if (!alive) return;
          setDocs([doc]); setActiveId(doc.id); setActiveDoc(doc);
          setStatus("이 기기 로컬 저장 완료"); setStatusKind("ok");
        }
      }).catch(function(error) {
        setStatus("로컬 저장소 오류"); setStatusKind("warn"); notify(error.message);
      });
      return function() { alive = false; clearTimeout(localTimer.current); clearTimeout(cloudTimer.current); };
    }, []);

    React.useEffect(function() { activeRef.current = activeDoc; }, [activeDoc]);

    function notify(message) {
      setToast(message);
      setTimeout(function() { setToast(""); }, 3200);
    }
    async function flushPending() {
      const pending = activeRef.current;
      clearTimeout(localTimer.current);
      clearTimeout(cloudTimer.current);
      if (!pending) return;
      try { await dbPut(pending); } catch (_) {}
      setDocs(function(items) {
        return items.map(function(item) { return item.id === pending.id ? pending : item; });
      });
      if (config.endpoint && config.key) await saveCloud(pending, false);
    }

    function updateDoc(next) {
      activeRef.current = next;
      setActiveDoc(next);
      setDocs(function(items) {
        const exists = items.some(function(item) { return item.id === next.id; });
        const updated = exists ? items.map(function(item) { return item.id === next.id ? next : item; }) : [next].concat(items);
        return updated.sort(function(a,b) { return b.updatedAt - a.updatedAt; });
      });
      clearTimeout(localTimer.current);
      localTimer.current = setTimeout(async function() {
        try {
          await dbPut(next);
          setStatus("로컬 저장 완료"); setStatusKind("ok");
        } catch (error) { setStatus("로컬 저장 실패"); setStatusKind("warn"); }
      }, 500);
      clearTimeout(cloudTimer.current);
      cloudTimer.current = setTimeout(function() {
        if (config.endpoint && config.key) saveCloud(next, false);
      }, 6500);
    }

    async function saveCloud(doc, showMessage, syncConfig) {
      if (cloudBusy.current) {
        const index = cloudQueued.current.findIndex(function(item) { return item.doc.id === doc.id; });
        const queuedItem = { doc: doc, showMessage: showMessage, syncConfig: syncConfig || config };
        if (index >= 0) cloudQueued.current[index] = queuedItem;
        else cloudQueued.current.push(queuedItem);
        return;
      }
      cloudBusy.current = true;
      const connection = syncConfig || config;
      try {
        const targetName = doc.desiredCloudName || doc.cloudName || safeName(doc.title, "drawing-" + doc.id.slice(0,8));
        const fingerprint = JSON.stringify(doc.document);
        if (doc.cloudName === targetName && lastCloudFingerprint.current === doc.id + ":" + fingerprint) return;
        setStatus("GitHub 저장 중"); setStatusKind("");
        let saved;
        if (doc.cloudName && doc.cloudName !== targetName) {
          saved = await requestCloud(connection, "/api/drawings/" + encodeURIComponent(targetName) + ".excalidraw", "PUT", { document: doc.document });
          await requestCloud(connection, "/api/drawings/" + encodeURIComponent(doc.cloudName) + ".excalidraw", "DELETE", { sha: doc.cloudSha });
        } else {
          saved = await requestCloud(connection, "/api/drawings/" + encodeURIComponent(targetName) + ".excalidraw", "PUT", {
            document: doc.document,
            sha: doc.cloudSha || undefined
          });
        }
        lastCloudFingerprint.current = doc.id + ":" + fingerprint;
        const latest = activeRef.current && activeRef.current.id === doc.id ? activeRef.current : doc;
        const updated = Object.assign({}, latest, {
          cloudName: targetName,
          desiredCloudName: latest.desiredCloudName === targetName ? "" : (latest.desiredCloudName || ""),
          cloudSha: saved.sha,
          updatedAt: Date.now()
        });
        await dbPut(updated);
        if (activeRef.current && activeRef.current.id === doc.id) {
          activeRef.current = updated; setActiveDoc(updated);
        }
        setDocs(function(items) { return items.map(function(item) { return item.id === doc.id ? updated : item; }); });
        setStatus("GitHub 자동 저장 완료"); setStatusKind("ok");
        if (showMessage) notify("GitHub에 저장했습니다.");
      } catch (error) {
        setStatus("GitHub 저장 대기 · 로컬 보관 중"); setStatusKind("warn");
        if (showMessage) notify(error.message);
      } finally {
        cloudBusy.current = false;
        const queued = cloudQueued.current.shift();
        if (queued) {
          const latest = activeRef.current && activeRef.current.id === queued.doc.id ? activeRef.current : queued.doc;
          saveCloud(latest, queued.showMessage, queued.syncConfig);
        }
      }
    }
    async function createNew() {
      await flushPending();
      const doc = newDocument("새 드로잉");
      dbPut(doc).catch(function() {});
      setDocs(function(items) { return [doc].concat(items); });
      setActiveId(doc.id); setActiveDoc(doc); activeRef.current = doc;
      lastCloudFingerprint.current = "";
      setStatus("새 드로잉 · 로컬 저장"); setStatusKind("ok");
    }
    async function openLocal(doc) {
      await flushPending();
      const storedDocs = await dbAll().catch(function() { return []; });
      const selected = storedDocs.find(function(item) { return item.id === doc.id; }) || doc;
      setDocs(function(items) {
        return items.map(function(item) { return item.id === selected.id ? selected : item; });
      });
      setActiveId(selected.id); setActiveDoc(selected); activeRef.current = selected;
      lastCloudFingerprint.current = "";
      setStatus(selected.cloudName ? "GitHub 동기화 문서" : "이 기기 로컬 문서");
      setStatusKind(selected.cloudName ? "ok" : "");
    }
    async function renameActive() {
      const current = activeRef.current;
      if (!current) return;
      const title = prompt("드로잉 이름", current.title);
      if (title === null) return;
      const clean = title.trim().slice(0, 80);
      if (!clean) return notify("이름을 입력해주세요.");
      const cloudName = safeName(clean, "drawing-" + current.id.slice(0,8));
      const updated = Object.assign({}, current, { title: clean, desiredCloudName: cloudName, updatedAt: Date.now() });
      updateDoc(updated);
      if (config.endpoint && config.key) saveCloud(updated, true);
    }
    async function deleteActive() {
      if (!activeDoc || !confirm("'" + activeDoc.title + "' 드로잉을 삭제할까요?")) return;
      if (activeDoc.cloudName && config.endpoint && config.key) {
        try { await requestCloud(config, "/api/drawings/" + encodeURIComponent(activeDoc.cloudName) + ".excalidraw", "DELETE", { sha: activeDoc.cloudSha }); }
        catch (error) { return notify("GitHub 삭제 실패: " + error.message); }
      }
      await dbDelete(activeDoc.id);
      const rest = docs.filter(function(item) { return item.id !== activeDoc.id; });
      activeRef.current = null;
      if (rest.length) { setDocs(rest); openLocal(rest[0]); }
      else { setDocs([]); setActiveId(""); setActiveDoc(null); createNew(); }
      notify("드로잉을 삭제했습니다.");
    }
    // Excalidraw can emit onChange during its own store/portal updates.
    // Keep canvas changes in refs and debounce persistence; do not set React
    // state from this callback, which can create a parent <-> Zustand update loop.
    const onCanvasChange = React.useCallback(function(elements, appState, files) {
      if (sharedDoc) return;
      const current = activeRef.current;
      if (!current) return;
      const document = {
        type: "excalidraw",
        version: 2,
        source: "https://excalidraw.com",
        elements: elements,
        appState: {
          viewBackgroundColor: appState.viewBackgroundColor || "#ffffff",
          gridSize: appState.gridSize === undefined ? null : appState.gridSize,
          theme: appState.theme || "light"
        },
        files: files || {}
      };
      const updated = Object.assign({}, current, { document: document, updatedAt: Date.now() });
      activeRef.current = updated;
      clearTimeout(localTimer.current);
      localTimer.current = setTimeout(async function() {
        const latest = activeRef.current && activeRef.current.id === updated.id ? activeRef.current : updated;
        try {
          await dbPut(latest);
          setStatus("로컬 저장 완료"); setStatusKind("ok");
        } catch (_) { setStatus("로컬 저장 실패"); setStatusKind("warn"); }
      }, 500);
      clearTimeout(cloudTimer.current);
      cloudTimer.current = setTimeout(function() {
        const latest = activeRef.current && activeRef.current.id === updated.id ? activeRef.current : updated;
        if (config.endpoint && config.key) saveCloud(latest, false);
      }, 6500);
    }, [config.endpoint, config.key]);
    function exportActive() {
      const current = activeRef.current;
      if (!current) return;
      downloadText(safeName(current.title, "drawing") + ".excalidraw", JSON.stringify(current.document, null, 2));
    }
    async function importFile(event) {
      const file = event.target.files && event.target.files[0];
      event.target.value = "";
      if (!file) return;
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed.type !== "excalidraw" || !Array.isArray(parsed.elements)) throw new Error("유효한 .excalidraw 파일이 아닙니다.");
        const doc = newDocument(file.name.replace(/\.excalidraw$/i, "") || "가져온 드로잉");
        doc.document = parsed;
        await dbPut(doc);
        setDocs(function(items) { return [doc].concat(items); });
        setActiveId(doc.id); setActiveDoc(doc); activeRef.current = doc;
        notify("드로잉을 가져왔습니다.");
      } catch (error) { notify(error.message); }
    }
    function saveSettings() {
      const next = { endpoint: endpointDraft.trim().replace(/\/+$/, ""), key: keyDraft.trim() };
      if (next.endpoint && !/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(next.endpoint)) {
        return notify("https://이름.계정.workers.dev 형식의 Worker 주소를 입력해주세요.");
      }
      if (!!next.endpoint !== !!next.key) return notify("Worker 주소와 동기화 키를 모두 입력해주세요.");
      localStorage.setItem(CONFIG_KEY, JSON.stringify(next));
      setConfig(next); setShowSettings(false);
      if (next.endpoint && activeRef.current) saveCloud(activeRef.current, true, next);
      else { setStatus("로컬 전용 저장"); setStatusKind("ok"); }
    }
    async function refreshCloud() {
      if (!config.endpoint || !config.key) { setShowSettings(true); return; }
      try {
        setBusy(true);
        const result = await requestCloud(config, "/api/drawings", "GET");
        setCloudItems(result.drawings || []);
        notify("GitHub 드로잉 " + (result.drawings || []).length + "개를 찾았습니다.");
      } catch (error) { notify(error.message); }
      finally { setBusy(false); }
    }
    async function openCloud(item) {
      try {
        await flushPending();
        setBusy(true);
        const result = await requestCloud(config, "/api/drawings/" + encodeURIComponent(item.name) + ".excalidraw", "GET");
        const existing = docs.find(function(doc) { return doc.cloudName === item.name; });
        const doc = existing || newDocument(item.name.replace(/-/g, " "));
        doc.title = item.name.replace(/-/g, " ");
        doc.cloudName = item.name; doc.cloudSha = result.sha; doc.document = result.document; doc.updatedAt = Date.now();
        await dbPut(doc);
        setDocs(function(items) { return [doc].concat(items.filter(function(d) { return d.id !== doc.id; })); });
        setActiveId(doc.id); setActiveDoc(doc); activeRef.current = doc;
        lastCloudFingerprint.current = doc.id + ":" + JSON.stringify(doc.document);
        setStatus("GitHub 문서 열기 완료"); setStatusKind("ok");
      } catch (error) { notify(error.message); }
      finally { setBusy(false); }
    }

    window.__whiteboardPro = {
      getDoc: function() { return activeRef.current; },
      getDocs: function() { return docs; },
      updateDoc: updateDoc,
      getCanvas: function() { return canvasApiRef.current; },
      getLib: function() { return ExcalidrawLib; },
      notify: notify,
      isShared: function() { return !!sharedDoc; }
    };
    const Excalidraw = ExcalidrawLib.Excalidraw;
    const onExcalidrawAPI = React.useCallback(function(api) { canvasApiRef.current = api; }, []);
    const canvasInitialData = React.useMemo(function() {
      return activeDoc ? {
        elements: activeDoc.document.elements || [],
        appState: activeDoc.document.appState || { viewBackgroundColor: "#ffffff" },
        files: activeDoc.document.files || {}
      } : null;
    }, [activeDoc && activeDoc.id, activeDoc && activeDoc.document]);
    const canvas = activeDoc ? h(Excalidraw, {
      key: activeDoc.id,
      initialData: canvasInitialData,
      onChange: onCanvasChange,
      excalidrawAPI: onExcalidrawAPI,
      viewModeEnabled: !!sharedDoc,
      langCode: "ko-KR",
      UIOptions: { canvasActions: { loadScene: false } }
    }) : h("div", { className: "empty-cloud" }, "새 드로잉을 만들어주세요.");

    return h("div", { className: "shell" },
      h("header", { className: "topbar" },
        h("a", { className: "brand", href: "../", style: { color: "inherit", textDecoration: "none" }, "aria-label": "메인 게임 선택으로 돌아가기" }, h("span", { className: "brand-mark" }, "✎"), h("span", { className: "brand-text" }, "WHITEBOARD")),
        h("a", { className: "btn", href: "../", style: { textDecoration: "none" } }, "← 메인으로"),
        activeDoc ? h("input", {
          className: "doc-title", value: activeDoc.title,
          onChange: function(event) { updateDoc(Object.assign({}, activeRef.current, { title: event.target.value, updatedAt: Date.now() })); },
          onBlur: function() { if (activeRef.current && activeRef.current.title.trim()) renameTitleSync(); },
          "aria-label": "드로잉 이름"
        }) : null,
        h("div", { className: "status" }, h("i", { className: "dot " + statusKind }), h("span", null, status)),
        h("button", { className: "btn primary", onClick: function() { const panel = document.getElementById("whiteboard-pro-panel"); if (panel) { panel.classList.add("open"); if (panel._refresh) panel._refresh(); } }, type: "button" }, "PRO 도구"),
        h("button", { className: "btn", onClick: function() { if (window.__knowledgeHubOpen) window.__knowledgeHubOpen(); }, type: "button" }, "지식관리"),
        h("div", { className: "spacer" }),
        h("button", { className: "btn", onClick: exportActive, disabled: !activeDoc }, "내보내기"),
        h("button", { className: "btn primary", onClick: function() { if (activeRef.current) saveCloud(activeRef.current, true); }, disabled: !config.endpoint || !activeDoc }, "GitHub 저장")
      ),
      h("div", { className: "workspace" },
        h("aside", { className: "sidebar" },
          h("div", { className: "side-head" }, "내 드로잉", h("span", { className: "doc-meta" }, docs.length + "개")),
          h("div", { className: "side-actions" },
            h("button", { className: "btn", onClick: createNew }, "＋ 새로 만들기"),
            h("button", { className: "btn", onClick: function() { document.getElementById("import-file").click(); } }, "가져오기")
          ),
          h("input", { id: "import-file", className: "file-input", type: "file", accept: ".excalidraw,.json,application/json", onChange: importFile }),
          h("div", { style: { padding: "0 10px 8px" } },
            h("select", {
              className: "btn", value: folderFilter,
              style: { width: "100%", textAlign: "left" },
              onChange: function(event) { setFolderFilter(event.target.value); }
            },
              h("option", { value: "" }, "모든 폴더"),
              Array.from(new Set(docs.map(function(item) { return item.folder || ""; }).filter(Boolean))).sort().map(function(folder) {
                return h("option", { key: folder, value: folder }, folder);
              })
            )
          ),
          h("div", { className: "doc-list" },
            docs.filter(function(doc) { return !folderFilter || (doc.folder || "") === folderFilter; }).map(function(doc) {
              return h("div", {
                key: doc.id, className: "doc-row" + (doc.id === activeId ? " active" : ""),
                onClick: function() { openLocal(doc); }, title: doc.title
              }, h("span", { className: "doc-icon" }, "▱"),
              h("span", { className: "doc-name" }, doc.title || "이름 없는 드로잉"),
              h("span", { className: "doc-meta" }, doc.cloudName ? "☁" : ""));
            }),
            h("div", { className: "cloud-list" },
              h("div", { className: "side-head" }, "GITHUB 저장소", h("button", { className: "btn", onClick: refreshCloud, disabled: busy }, "새로고침")),
              cloudItems.length ? cloudItems.map(function(item) {
                return h("div", { key: item.name, className: "doc-row", onClick: function() { openCloud(item); } },
                  h("span", { className: "doc-icon" }, "☁"),
                  h("span", { className: "doc-name" }, item.name));
              }) : h("div", { className: "empty-cloud" }, config.endpoint ? "GitHub 목록을 새로고침하세요." : "연결하면 저장된 파일이 표시됩니다.")
            )
          ),
          h("div", { className: "side-foot" },
            h("button", { className: "btn", onClick: renameActive, disabled: !activeDoc }, "이름 변경"),
            h("button", { className: "btn", onClick: deleteActive, disabled: !activeDoc }, "삭제"),
            h("button", { className: "btn", onClick: function() { setEndpointDraft(config.endpoint || ""); setKeyDraft(config.key || ""); setShowSettings(true); } }, "설정")
          )
        ),
        h("main", { className: "canvas-wrap" }, canvas)
      ),
      showSettings ? h("div", { className: "modal-backdrop", onClick: function(event) { if (event.target === event.currentTarget) setShowSettings(false); } },
        h("section", { className: "modal" },
          h("h2", null, "GitHub 자동 저장 연결"),
          h("p", null, "별도 회원가입이나 앱 로그인을 만들지 않습니다. Cloudflare Worker가 GitHub에 대신 저장하며, GitHub 토큰은 서버 비밀 변수로만 보관됩니다. 최초 1회 Worker 배포와 동기화 키 설정이 필요합니다."),
          h("div", { className: "field" }, h("label", null, "Cloudflare Worker 주소"), h("input", { value: endpointDraft, onChange: function(e) { setEndpointDraft(e.target.value); }, placeholder: "https://pvefps-whiteboard-sync.<계정>.workers.dev" })),
          h("div", { className: "field" }, h("label", null, "동기화 키"), h("input", { type: "password", value: keyDraft, onChange: function(e) { setKeyDraft(e.target.value); }, placeholder: "Cloudflare에 등록한 SYNC_KEY" })),
          h("div", { className: "hint" }, "동기화 키는 이 브라우저의 로컬 저장소에 저장됩니다. GitHub PAT를 여기에 입력하지 마세요. 연결하지 않아도 이 기기에서는 자동 저장됩니다."),
          h("div", { className: "modal-actions" },
            h("button", { className: "btn", onClick: function() { setShowSettings(false); } }, "취소"),
            h("button", { className: "btn primary", onClick: saveSettings }, "연결 저장")
          )
        )
      ) : null,
      toast ? h("div", { className: "toast" }, toast) : null
    );

    function renameTitleSync() {
      const current = activeRef.current;
      if (!current || !current.title.trim()) return;
      const desired = safeName(current.title, "drawing-" + current.id.slice(0,8));
      if (current.cloudName && current.cloudName !== desired && config.endpoint && config.key) {
        const next = Object.assign({}, current, { desiredCloudName: desired });
        activeRef.current = next; setActiveDoc(next);
        saveCloud(next, false);
      }
    }
  }

  createRoot(document.getElementById("root")).render(h(App));
  const proFeatures = await import("./pro-features.js");
  proFeatures.mount();
  const knowledgeHub = await import("./knowledge-hub.js?v=b3692c15");
  knowledgeHub.mountKnowledgeHub();
  window.__knowledgeHubOpen = knowledgeHub.openKnowledgeHub;
  const knowledgeCloud = await import("./supabase-sync.js?v=1");
  knowledgeCloud.mountKnowledgeSupabase();
  } catch (error) {
    console.error("Whiteboard boot failed:", error);
    showRuntimeError("화이트보드를 불러오지 못했습니다.", error && (error.stack || error.message) || error);
  }
})();
</script>
</body>
</html>
