name: Desert Front smoke test
on:
  push:
    paths:
      - "desert-strike/**"
      - ".github/workflows/desert-front.yml"
  pull_request:
    paths:
      - "desert-strike/**"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Faction skin catalog and loader regressions
        run: node --test desert-strike/tests/skin-catalog.test.cjs desert-strike/tests/skin-shop.test.cjs desert-strike/tests/ground-special-art.test.cjs
      - name: JavaScript syntax V1 + V2
        run: |
          node --check desert-strike/game.js
          node --check desert-strike/game-v2.js
          node --check desert-strike/expansion/expansion-rules.js
          node --check desert-strike/expansion/expansion-art.js
          node --check desert-strike/sprite-animations.js
          node --check desert-strike/isometric-world.js
          node --check desert-strike/heroine-factions.js
          node --check desert-strike/expansion-art.js
          node --check desert-strike/front-lobby.js
          node --check desert-strike/desert-member.js
          node --check desert-strike/battle-report.js
          node --check desert-strike/lobby-music.js
          node --check desert-strike/combat-audio.js
          node --check desert-strike/augment-rules.js
          node --check desert-strike/prism-experiments.js
          node --check desert-strike/augment-history.js
          node --check desert-strike/augment-codex.js
          node --check desert-strike/career-profile.js
          node --check desert-strike/audio-settings.js
          node --check desert-strike/tri-lane-engine.js
          node --check desert-strike/tri-lane-network.js
          node --check desert-strike/tri-lane-ui.js
          node --check desert-strike/balance-sim.cjs
      - name: Lobby and battle BGM transitions
        run: node --test desert-strike/smoke-bgm.test.cjs
      - name: Unlimited waves in solo and PvP/co-op with core-only victory
        run: node --test desert-strike/smoke-endless-waves.test.cjs
      - name: Combat parity, faction prices, anti-air targeting and special-role balance
        run: node --test desert-strike/smoke-balance-parity.test.cjs
      - name: Mixed Prism offers and Prism-only rules across all modes
        run: node --test desert-strike/smoke-prism-mode.test.cjs
      - name: Experimental 100 Prism mechanics and 400-card integration
        run: node --test desert-strike/smoke-prism-experiments.test.cjs
      - name: Lobby 300-card augment codex by common, faction, tier and search
        run: node --test desert-strike/smoke-augment-codex.test.cjs
      - name: Hoverable round-by-round augment pick history for solo and multi
        run: node --test desert-strike/smoke-augment-history.test.cjs
      - name: Single-player 300-card augment draft and original-mode isolation
        run: node --test desert-strike/smoke-solo-augments.test.cjs
      # Test draft auto-focus before unrelated specialist smoke failures can short-circuit the workflow.
      - name: Multiplayer in-board lane selector, swipe and build safety
        run: node desert-strike/smoke-mp-production-ui.test.cjs
      - name: Match report, per-unit production totals and server result callbacks
        run: node --test desert-strike/smoke-match-results.test.cjs
      - name: All ten faction tower sprites in solo and multiplayer
        run: node --test desert-strike/smoke-tower-sprites.test.cjs
      - name: Original image asset and real per-faction projectile frames
        run: node --test desert-strike/smoke-original-art.test.cjs
      - name: No artillery or regen penalty, 30-second Prism, solo-like multiplayer view
        run: node --test desert-strike/smoke-mp-20min.test.cjs
      - name: Tactical counters take priority over hero production
        run: node --test desert-strike/smoke-ai-adaptation.test.cjs
      - name: Live sniper assassin solo/multi parity and five difficulty AI combat
        run: node --test desert-strike/smoke-live-specialists.test.cjs
      - name: Live sniper and assassin rules, 40 sprite strips and real-engine combat
        run: node --test desert-strike/expansion/smoke-expansion.test.cjs
      - name: Scoped cost-aware response to infantry-screened siege
        run: node --test desert-strike/smoke-ai-screened-siege.test.cjs
      - name: Five AI difficulty levels and multiplayer counters
        run: node --test desert-strike/smoke-five-ai-levels.test.cjs
      - name: Godot 300-card augment parity and sandboxed host decisions
        run: node --test desert-strike/smoke-augments.test.cjs
      - name: Public-only Firestore room discovery and legacy invite safety
        run: node --test desert-strike/smoke-public-room.test.cjs
      - name: Supabase username account guest and server-forfeit wiring
        run: node --test desert-strike/smoke-supabase-members.test.cjs
      - name: Visible augment ruleset picker and synchronized multiplayer practice
        run: node --test desert-strike/smoke-lobby-ruleset.test.cjs
      - name: Commander rank SVG, inline multiplayer and modal login
        run: node --test desert-strike/smoke-lobby-ranks.test.cjs
      - name: Local 40-match history and unofficial RP safety
        run: node --test desert-strike/smoke-career.test.cjs
      - name: Godot combat voice assets and web event hooks
        run: node --test desert-strike/smoke-combat-audio.test.cjs
      - name: Guardians survive human and AI nuclear strikes in solo and multiplayer
        run: node --test desert-strike/smoke-guardian-nuke.test.cjs
      - name: Forward tower blocks newly spawned units in solo-scale classic and 3-lane multiplayer
        run: node --test desert-strike/smoke-forward-tower-aggro.test.cjs
      - name: Escalating counter damage, projectile parity and unchanged base attacks
        run: node --test desert-strike/smoke-counter-pressure.test.cjs
      - name: Fairy healing and beastkin ranged defense parity
        run: node desert-strike/smoke-faction-tuning.test.cjs
      - name: Gameplay regression V1
        run: node desert-strike/smoke.test.cjs
      - name: Fifty-wave construction income and core parity across all game modes
        run: node desert-strike/smoke-50-wave-rules.test.cjs
      - name: Gameplay V2
        run: node desert-strike/smoke-v2.test.cjs
      - name: Legacy 16-frame sprite regression (24 original units)
        run: node desert-strike/smoke-animations.test.cjs
      - name: 2.5D original 32-unit isometric rendering
        run: node desert-strike/smoke-isometric.test.cjs
      - name: Classic 1v1 single-map PvP and existing 3-lane compatibility
        run: node desert-strike/smoke-classic-duel.test.cjs
      - name: Multiplayer authoritative upgrades and tactical support
        run: node desert-strike/smoke-mp-upgrades.test.cjs
      - name: Three-line PvP and cooperative host-authoritative combat
        run: node desert-strike/smoke-trilane.test.cjs
      - name: Hero offspring and capture balance invariants
        run: node desert-strike/smoke-hero-inheritance.test.cjs
      - name: External visitor room creation and nonblocking server ledger regression
        run: node --test desert-strike/smoke-external-rooms.test.cjs
      - name: WebRTC and Firebase mocked 1v1 handshake and real-time orders
        run: node desert-strike/smoke-trilane-network.test.cjs
      - name: Ten-faction 80-unit art and commander lobby progression
        run: node desert-strike/smoke-nine.test.cjs
      - name: Tower / vision / anti-greed strategy regressions
        run: node desert-strike/smoke-strategy.test.cjs
      - name: Hard AI 30-pair comparative win-rate benchmark
        run: node desert-strike/hard-ai-winrate-benchmark.cjs | tee /tmp/desert-hard-winrate.log
      - name: Faction-aware prices and 2400/7200 CR role engagements
        run: |
          node desert-strike/benchmark-unit-pricing.cjs > /tmp/desert-price-balance.json
          node desert-strike/benchmark-role-balance.cjs > /tmp/desert-role-balance.json
      - name: Ten-faction seeded 180-match balance simulation
        run: node desert-strike/smoke-balance.test.cjs > /tmp/desert-balance.json
      - name: Beastgirls and elven mages full sprite coverage
        run: node desert-strike/smoke-heroine.test.cjs

      - name: Ten-faction mirrored skirmish win rates
        run: node desert-strike/balance-sim.cjs skirmish 2 | tee /tmp/desert-skirmish.log
      - name: Ten-faction mirrored long-wave campaigns
        run: node desert-strike/balance-sim.cjs campaign 2 | tee /tmp/desert-campaign.log
      - name: Save ten-faction benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desert-front-balance-report
          path: |
            /tmp/desert-price-balance.json
            /tmp/desert-role-balance.json
            /tmp/desert-balance.json
            /tmp/desert-skirmish.log
            /tmp/desert-campaign.log
            /tmp/desert-hard-winrate.log
          if-no-files-found: warn
