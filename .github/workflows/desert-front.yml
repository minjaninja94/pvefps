name: Desert Front smoke test
on:
  push:
    paths:
      - "desert-strike/**"
      - ".github/workflows/desert-front.yml"
  pull_request:
    paths:
      - "desert-strike/**"
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax V1 + V2
        run: |
          node --check desert-strike/game.js
          node --check desert-strike/game-v2.js
          node --check desert-strike/sprite-animations.js
          node --check desert-strike/isometric-world.js
          node --check desert-strike/heroine-factions.js
          node --check desert-strike/balance-sim.cjs
      - name: Gameplay regression V1
        run: node desert-strike/smoke.test.cjs
      - name: Gameplay V2
        run: node desert-strike/smoke-v2.test.cjs
      - name: Legacy 16-frame sprite regression (24 original units)
        run: node desert-strike/smoke-animations.test.cjs
      - name: 2.5D original 32-unit isometric rendering
        run: node desert-strike/smoke-isometric.test.cjs
      - name: Six-faction seeded 150-match balance simulation
        run: node desert-strike/smoke-balance.test.cjs > /tmp/desert-balance.json
      - name: Beastgirls and elven mages full sprite coverage
        run: node desert-strike/smoke-heroine.test.cjs

      - name: Six-faction mirrored skirmish win rates
        run: node desert-strike/balance-sim.cjs skirmish 2
      - name: Six-faction mirrored long-wave campaigns
        run: node desert-strike/balance-sim.cjs campaign 2
