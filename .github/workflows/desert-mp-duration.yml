name: Desert Front 20-minute multiplayer pacing sample
on:
  push:
    paths:
      - "desert-strike/benchmark-mp-duration.cjs"
      - ".github/workflows/desert-mp-duration.yml"
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Simulate mature mirrored PvP at real tick duration
        run: node desert-strike/benchmark-mp-duration.cjs
