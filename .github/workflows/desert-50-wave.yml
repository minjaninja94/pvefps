name: Desert Front 50-wave campaign benchmark
on:
  push:
    paths:
      - "desert-strike/game-v2.js"
      - "desert-strike/tri-lane-engine.js"
      - "desert-strike/benchmark-50-wave.cjs"
      - "desert-strike/benchmark-unit-pricing.cjs"
      - "desert-strike/smoke-50-wave-rules.test.cjs"
      - ".github/workflows/desert-50-wave.yml"
  workflow_dispatch:
jobs:
  real-engine-50-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify actual game rules across solo/multi and standard/augment
        run: node desert-strike/smoke-50-wave-rules.test.cjs
      - name: Simulate eight solo and two cooperative campaigns, up to 72 waves
        run: node desert-strike/benchmark-50-wave.cjs | tee /tmp/desert-50-wave.jsonl
      - name: Compare legacy and revised prices in 304 real-engine engagements
        run: |
          node desert-strike/benchmark-unit-pricing.cjs --legacy > /tmp/desert-pricing-legacy.json
          node desert-strike/benchmark-unit-pricing.cjs > /tmp/desert-pricing-revised.json
      - name: Publish measured match outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desert-50-wave-campaign-results
          path: |
            /tmp/desert-50-wave.jsonl
            /tmp/desert-pricing-legacy.json
            /tmp/desert-pricing-revised.json
          if-no-files-found: warn
