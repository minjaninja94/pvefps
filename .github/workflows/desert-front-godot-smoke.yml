name: Desert Front Godot smoke

on:
  push:
    branches:
      - feature/desert-front-godot-port
    paths:
      - "desert-front-godot/**"
      - ".github/workflows/desert-front-godot-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-godot-port:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up modern Node.js for web engine stat comparison
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download pinned NodeTunnel relay plugin
        run: |
          apt-get update -qq
          apt-get install -y -qq curl unzip ca-certificates python3
          mkdir -p desert-front-godot/addons
          curl --retry 3 -fsSL \
            https://github.com/NodeTunnel/godot-plugin/releases/download/v1.1.1_beta/nodetunnel.zip \
            -o /tmp/nodetunnel.zip
          unzip -oq /tmp/nodetunnel.zip -d desert-front-godot/addons/
          test -f desert-front-godot/addons/nodetunnel/NodeTunnel.gdextension
      - name: Synchronize original unit sprite strips (read-only source)
        run: python3 desert-front-godot/tools/sync_web_art.py
      - name: Import Godot project and check scripts
        run: godot --headless --path desert-front-godot --editor --quit
      - name: Validate 80 native sprite resources and 10 banners
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/art_smoke.gd
      - name: Compare all original 80 unit stats to the native roster
        run: python3 desert-front-godot/tools/verify_stat_parity.py
      - name: Verify generated command icon atlas
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/icons_smoke.gd
      - name: Run isolated simulation smoke test
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/smoke.gd
      - name: Verify classic, 3-line, 2v2, and AI co-op battle simulation
        run: timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_match_smoke.gd
      - name: Verify balance and cosmetic parity invariants
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/parity_smoke.gd
      - name: Validate local saved-match summary
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/records_smoke.gd
      - name: Validate local member XP and unofficial tier progression
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/profile_tier_smoke.gd
      - name: Verify Firebase REST serialization and existing project settings
        run: timeout 60s godot --headless --path desert-front-godot --script res://tests/firebase_schema_smoke.gd
      - name: Launch 3-line native multiplayer interface
        run: timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_scene_smoke.gd
      - name: Run two-process LAN host/guest integration
        run: |
          set -eu
          godot --headless --path desert-front-godot --script res://tests/net_host.gd > /tmp/df-host.log 2>&1 &
          host_pid=$!
          trap 'kill "$host_pid" 2>/dev/null || true' EXIT
          sleep 2
          godot --headless --path desert-front-godot --script res://tests/net_client.gd > /tmp/df-client.log 2>&1 || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          wait "$host_pid" || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          cat /tmp/df-host.log /tmp/df-client.log
      - name: Verify 4-player 2v2 native LAN host/guest room and ordered production
        run: |
          set -eu
          godot --headless --path desert-front-godot --script res://tests/tri_net_host.gd > /tmp/tri-2v2-host.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest1.log 2>&1 &
          c1=$!
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest2.log 2>&1 &
          c2=$!
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 0 >/tmp/tri-2v2-guest3.log 2>&1 &
          c3=$!
          err=0
          wait "$pid" || err=1
          wait "$c1" || err=1
          wait "$c2" || err=1
          wait "$c3" || err=1
          cat /tmp/tri-2v2-*.log
          exit "$err"
      - name: Configure Godot Windows export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
      - name: Export Windows preview build
        run: |
          mkdir -p desert-front-godot/build
          cd desert-front-godot
          godot --headless --export-release "Windows Desktop" build/DesertFront.exe
      - name: Include Windows relay extension DLL
        run: |
          set -eu
          expected="desert-front-godot/build/addons/nodetunnel/bin/nodetunnel.dll"
          if [ ! -f "$expected" ]; then
            mkdir -p "$(dirname "$expected")"
            cp desert-front-godot/addons/nodetunnel/bin/nodetunnel.dll "$expected"
          fi
          test -s "$expected"
          find desert-front-godot/build -type f -maxdepth 6 | sort
      - name: Upload Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: desert-front-godot-windows-preview
          path: desert-front-godot/build/**
          if-no-files-found: error
