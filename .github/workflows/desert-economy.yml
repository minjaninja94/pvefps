name: Desert Front HUD and economy regression
on:
  push:
    paths:
      - 'desert-strike/**'
      - '.github/workflows/desert-economy.yml'
  pull_request:
    paths:
      - 'desert-strike/**'
      - '.github/workflows/desert-economy.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check desert-strike/game-v2.js
          node --check desert-strike/tri-lane-engine.js
          node --check desert-strike/tri-lane-ui.js
          node --check desert-strike/command-hud.js
          node --check desert-strike/resource-art.js
      - name: Device account authentication boundaries
        run: node desert-strike/smoke-device-account.test.cjs
      - name: Forward towers, guardian boundaries and offensive artillery heroes
        run: node desert-strike/smoke-guardian.test.cjs
      - name: Hero consolidation and exact aggregate stats
        run: node desert-strike/smoke-consolidation.test.cjs
      - name: Paid proactive hard AI and income parity
        run: node desert-strike/smoke-hard-ai.test.cjs
      - name: Fifty-wave construction income and core parity across all game modes
        run: node desert-strike/smoke-50-wave-rules.test.cjs
      - name: Half-time pacing, unchanged combat specs and income
        run: node desert-strike/smoke-half-time-pacing.test.cjs
      - name: Economy and occupied production slots
        run: node desert-strike/smoke-economy.test.cjs
      - name: Cooperative combat
        run: node desert-strike/smoke-trilane.test.cjs
      - name: Authoritative networking
        run: node desert-strike/smoke-trilane-network.test.cjs
      - name: Alternate skin animation and portrait assets
        run: node desert-strike/smoke-moe.test.cjs
      - name: Faction action atlas cells
        run: node desert-strike/smoke-reference.test.cjs
