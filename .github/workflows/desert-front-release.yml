# Publication checks: native art, 3-line 1v1/2v2/3v3/co-op simulation, UI and real 4-process LAN 2v2.
name: Desert Front Windows public preview release
on:
  push:
    branches:
      - feature/desert-front-godot-port
    paths:
      - ".github/workflows/desert-front-release.yml"
      - "desert-front-godot/**"
      - "desert-strike/**"
      - "desert-front-download/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-export:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    env:
      RELEASE_TAG: desert-front-v0.4.0-alpha.1
      RELEASE_FILENAME: DesertFront-Preview-Windows.zip
      # NodeTunnel app ID is a public CLIENT identifier, not a credential.
      NODETUNNEL_APP_ID: "0j7l88abdzanueq"
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities and NodeTunnel plugin
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq curl unzip ca-certificates python3
          mkdir -p desert-front-godot/addons
          curl --retry 3 -fsSL https://github.com/NodeTunnel/godot-plugin/releases/download/v1.1.1_beta/nodetunnel.zip -o /tmp/nodetunnel.zip
          unzip -oq /tmp/nodetunnel.zip -d desert-front-godot/addons/
          test -s desert-front-godot/addons/nodetunnel/bin/nodetunnel.dll
      - name: Copy original sprite assets into new Godot project
        run: python3 desert-front-godot/tools/sync_web_art.py
      - name: Set up modern Node.js for web engine stat comparison
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Godot project and smoke tests
        run: |
          set -eu
          godot --headless --path desert-front-godot --editor --quit
          timeout 60s godot --headless --path desert-front-godot --script res://tests/art_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/icons_smoke.gd
          python3 desert-front-godot/tools/verify_stat_parity.py
          python3 desert-front-godot/tools/verify_combat_parity.py
          timeout 60s godot --headless --path desert-front-godot --script res://tests/smoke.gd
          timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_match_smoke.gd
          timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_scene_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/parity_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/records_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/profile_tier_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/firebase_schema_smoke.gd
      - name: Test local LAN host/guest connection
        run: |
          set -eu
          timeout 60s godot --headless --path desert-front-godot --script res://tests/net_host.gd >/tmp/df-host.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout 60s godot --headless --path desert-front-godot --script res://tests/net_client.gd >/tmp/df-client.log 2>&1 || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          wait "$pid" || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          cat /tmp/df-host.log /tmp/df-client.log
      - name: Test 4-player native 2v2 LAN battle room and commands
        run: |
          set -eu
          timeout 60s godot --headless --path desert-front-godot --script res://tests/tri_net_host.gd > /tmp/tri-2v2-host.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout 60s godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest1.log 2>&1 &
          c1=$!
          timeout 60s godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest2.log 2>&1 &
          c2=$!
          timeout 60s godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 0 >/tmp/tri-2v2-guest3.log 2>&1 &
          c3=$!
          err=0
          wait "$pid" || err=1
          wait "$c1" || err=1
          wait "$c2" || err=1
          wait "$c3" || err=1
          cat /tmp/tri-2v2-*.log
          exit "$err"
      - name: Export Windows 64-bit preview
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          mkdir -p desert-front-godot/build
          (cd desert-front-godot && godot --headless --export-release "Windows Desktop" build/DesertFront.exe)
          test -s desert-front-godot/build/DesertFront.exe
          test -s desert-front-godot/build/DesertFront.pck
          test -s desert-front-godot/build/addons/nodetunnel/bin/nodetunnel.dll || {
            mkdir -p desert-front-godot/build/addons/nodetunnel/bin
            cp desert-front-godot/addons/nodetunnel/bin/nodetunnel.dll desert-front-godot/build/addons/nodetunnel/bin/
          }
      - name: Prepare native payload and third-party license
        run: python3 desert-front-godot/tools/prepare_windows_payload.py
      - name: Transfer verified native build to Windows packaging
        uses: actions/upload-artifact@v4
        with:
          name: desert-front-windows-payload
          path: desert-front-godot/build/
          if-no-files-found: error
          retention-days: 7
  package-and-publish:
    needs: test-and-export
    runs-on: windows-2022
    env:
      RELEASE_TAG: desert-front-v0.4.0-alpha.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desert-front-windows-payload
          path: desert-front-godot/build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set the native Windows game icon
        shell: pwsh
        run: |
          $numericVersion = (Get-Content desert-front-godot/VERSION -Raw).Trim().Replace("-alpha.", ".")
          $editor = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
          Invoke-WebRequest "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $editor
          $shortExe = Join-Path $env:RUNNER_TEMP "DF.exe"
          $shortIcon = Join-Path $env:RUNNER_TEMP "DF.ico"
          Copy-Item desert-front-godot/build/DesertFront.exe $shortExe
          Copy-Item desert-front-godot/assets/ui/desert-front-icon.ico $shortIcon
          & $editor $shortExe --set-icon $shortIcon --set-file-version $numericVersion --set-product-version $numericVersion --set-version-string ProductName "Desert Front" --set-version-string FileDescription "Desert Front Windows Preview"
          if ($LASTEXITCODE -ne 0) { throw "Could not apply the game window icon" }
          Copy-Item $shortExe desert-front-godot/build/DesertFront.exe -Force
      - name: Build one-file Windows launcher with its own icon
        shell: pwsh
        run: |
          $numericVersion = (Get-Content desert-front-godot/VERSION -Raw).Trim().Replace("-alpha.", ".")
          python desert-front-godot/tools/package_single_exe.py
          Push-Location desert-front-godot/launcher
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --out rsrc --manifest gui --file-version $numericVersion --product-version $numericVersion --icon ../assets/ui/desert-front-icon.ico --product-name "Desert Front" --file-description "Desert Front Windows Preview"
          if ($LASTEXITCODE -ne 0) { throw "Could not create the launcher icon" }
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o ../build/DesertFront-Windows.exe .
          if ($LASTEXITCODE -ne 0) { throw "Could not build the single EXE" }
          Pop-Location
      - name: Test a clean first launch and cached second launch
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "desert-front-clean-user"
          $game = (Resolve-Path desert-front-godot/build/DesertFront-Windows.exe).Path
          for ($i = 0; $i -lt 2; $i++) {
            $result = Start-Process -FilePath $game -ArgumentList @("--headless", "--quit-after", "3") -WindowStyle Hidden -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Single-file launch failed (pass $i): $($result.ExitCode)" }
          }
          $files = Get-ChildItem $env:LOCALAPPDATA -Recurse -File
          if (-not ($files | Where-Object Name -eq "nodetunnel.dll")) { throw "Online DLL was not extracted" }
          if (-not ($files | Where-Object Name -eq "DesertFront.pck")) { throw "Game data was not extracted" }
      - name: Publish verified EXE to GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TARGET: ${{ github.ref_name }}
        run: python desert-front-godot/tools/publish_release.py
