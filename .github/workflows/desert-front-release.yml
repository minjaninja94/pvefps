# Publication checks: native art, 3-line 1v1/2v2/3v3/co-op simulation, UI and real 4-process LAN 2v2.
name: Desert Front Windows public preview release
on:
  push:
    branches:
      - feature/desert-front-godot-port
    paths:
      - ".github/workflows/desert-front-release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    env:
      RELEASE_TAG: desert-front-preview
      RELEASE_FILENAME: DesertFront-Preview-Windows.zip
      # NodeTunnel app ID is a public CLIENT identifier, not a credential.
      NODETUNNEL_APP_ID: "0j7l88abdzanueq"
    steps:
      - uses: actions/checkout@v4
      - name: Install build utilities and NodeTunnel plugin
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y -qq curl unzip ca-certificates python3
          mkdir -p desert-front-godot/addons
          curl --retry 3 -fsSL https://github.com/NodeTunnel/godot-plugin/releases/download/v1.1.1_beta/nodetunnel.zip -o /tmp/nodetunnel.zip
          unzip -oq /tmp/nodetunnel.zip -d desert-front-godot/addons/
          test -s desert-front-godot/addons/nodetunnel/bin/nodetunnel.dll
      - name: Copy original sprite assets into new Godot project
        run: python3 desert-front-godot/tools/sync_web_art.py
      - name: Validate Godot project and smoke tests
        run: |
          set -eu
          godot --headless --path desert-front-godot --editor --quit
          godot --headless --path desert-front-godot --script res://tests/art_smoke.gd
          godot --headless --path desert-front-godot --script res://tests/smoke.gd
          timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_match_smoke.gd
          timeout 90s godot --headless --path desert-front-godot --script res://tests/tri_scene_smoke.gd
          timeout 60s godot --headless --path desert-front-godot --script res://tests/parity_smoke.gd
      - name: Test local LAN host/guest connection
        run: |
          set -eu
          godot --headless --path desert-front-godot --script res://tests/net_host.gd >/tmp/df-host.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          godot --headless --path desert-front-godot --script res://tests/net_client.gd >/tmp/df-client.log 2>&1 || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          wait "$pid" || { cat /tmp/df-host.log /tmp/df-client.log; exit 1; }
          cat /tmp/df-host.log /tmp/df-client.log
      - name: Test 4-player native 2v2 LAN battle room and commands
        run: |
          set -eu
          godot --headless --path desert-front-godot --script res://tests/tri_net_host.gd > /tmp/tri-2v2-host.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest1.log 2>&1 &
          c1=$!
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 1 >/tmp/tri-2v2-guest2.log 2>&1 &
          c2=$!
          godot --headless --path desert-front-godot --script res://tests/tri_net_client.gd -- 0 >/tmp/tri-2v2-guest3.log 2>&1 &
          c3=$!
          err=0
          wait "$pid" || err=1
          wait "$c1" || err=1
          wait "$c2" || err=1
          wait "$c3" || err=1
          cat /tmp/tri-2v2-*.log
          exit "$err"
      - name: Export Windows 64-bit preview
        run: |
          set -eu
          mkdir -p "$HOME/.local/share/godot/export_templates"
          cp -a /root/.local/share/godot/export_templates/4.3.stable "$HOME/.local/share/godot/export_templates/"
          mkdir -p desert-front-godot/build
          (cd desert-front-godot && godot --headless --export-release "Windows Desktop" build/DesertFront.exe)
          test -s desert-front-godot/build/DesertFront.exe
          test -s desert-front-godot/build/DesertFront.pck
          test -s desert-front-godot/build/addons/nodetunnel/bin/nodetunnel.dll || {
            mkdir -p desert-front-godot/build/addons/nodetunnel/bin
            cp desert-front-godot/addons/nodetunnel/bin/nodetunnel.dll desert-front-godot/build/addons/nodetunnel/bin/
          }
      - name: Package ZIP with preconfigured free relay
        run: |
          set -eu
          python3 - <<'PY'
          import os,pathlib,zipfile
          base=pathlib.Path("desert-front-godot/build")
          app=os.environ["NODETUNNEL_APP_ID"].strip()
          assert len(app)>=8
          (base/"online_relay.cfg").write_text('[relay]\napp_id="'+app+'"\naddress="us-east.nodetunnel.io:8080"\n',encoding="utf-8")
          (base/"READ_FIRST.txt").write_text(
              "DESERT FRONT / WINDOWS PREVIEW\n\n"
              "1. Extract all files from this ZIP into one folder.\n"
              "2. Run DesertFront.exe. No Steam login required.\n"
              "3. Select Online Public Room or Private Room, or search/join.\n"
              "4. Online service is beta and may be unavailable.\n"
              "5. New 3-lane 1v1, 2v2, 3v3 and co-op modes are in ALPHA.\n"
              "   Complete web parity and Internet reliability are NOT confirmed.\n"
              "6. Online Internet P2P test with two remote PCs is NOT yet verified.\n"
              "7. This unsigned test EXE may show a Windows SmartScreen warning.\n",
              encoding="utf-8"
          )
          target=pathlib.Path(os.environ["RELEASE_FILENAME"])
          with zipfile.ZipFile(target,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as output:
              for path in base.rglob("*"):
                  if path.is_file(): output.write(path,path.relative_to(base).as_posix())
              output.write("desert-front-godot/addons/nodetunnel/LICENSE","THIRD_PARTY_LICENSES/NodeTunnel_LICENSE.txt")
          with zipfile.ZipFile(target) as archive:
              for required in ("DesertFront.exe","DesertFront.pck","online_relay.cfg","addons/nodetunnel/bin/nodetunnel.dll"):
                  assert required in archive.namelist(),required
          print("Verified ZIP:",target.stat().st_size,"bytes")
          PY
      - name: Publish public GitHub prerelease and replace ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TARGET: ${{ github.ref_name }}
        run: |
          set -eu
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,urllib.error,urllib.parse
          repo=os.environ["GH_REPOSITORY"]
          headers={
            "Authorization":"Bearer "+os.environ["GH_TOKEN"],
            "Accept":"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "User-Agent":"desert-front-publisher"
          }
          base="https://api.github.com/repos/"+repo
          def api(url,method="GET",payload=None,kind=None):
              hh=dict(headers)
              data=None
              if payload is not None:
                  data=json.dumps(payload).encode() if kind is None else payload
                  hh["Content-Type"]=kind or "application/json"
              request=urllib.request.Request(url,headers=hh,data=data,method=method)
              with urllib.request.urlopen(request,timeout=120) as response:
                  result=response.read()
                  return json.loads(result) if result and "json" in response.headers.get("Content-Type","") else result
          tag=os.environ["RELEASE_TAG"]
          name=os.environ["RELEASE_FILENAME"]
          description=(
            "DESERT FRONT Windows preview (Godot 4) - open public/private relay lobby, room codes, host-authoritative basic 1v1.\n\n"
            "Download ZIP, extract completely, and run DesertFront.exe; no Steam account or player IP/port forwarding.\n\n"
            "Experimental: Online relay uses NodeTunnel third-party beta and has not been tested between two remote PCs. "
            "Original 80 unit pixel sprite strips and 10 faction banners are included. Native code now has 3-line PvP 1v1/2v2/3v3 and 2/3-person co-op, hero aggregation, guardian and faction passives, but full web parity and remote Internet multiplayer are not yet verified."
          )
          try:
              release=api(base+"/releases/tags/"+tag)
          except urllib.error.HTTPError as error:
              if error.code!=404: raise
              release=api(base+"/releases",method="POST",payload={
                "tag_name":tag,"target_commitish":os.environ["GH_TARGET"],
                "name":"Desert Front | Windows Preview",
                "body":description,"prerelease":True,"draft":False
              })
          else:
              release=api(base+"/releases/"+str(release["id"]),method="PATCH",
                payload={"body":description,"prerelease":True,"draft":False})
          for asset in release.get("assets",[]):
              if asset.get("name")==name:
                  api(base+"/releases/assets/"+str(asset["id"]),method="DELETE")
          raw=pathlib.Path(name).read_bytes()
          url=release["upload_url"].split("{",1)[0]+"?"+urllib.parse.urlencode({"name":name})
          result=api(url,method="POST",payload=raw,kind="application/zip")
          assert result["name"]==name
          print("Release URL:",release["html_url"])
          print("Public file:",result["browser_download_url"])
          PY
