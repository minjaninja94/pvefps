<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니게임 랭킹</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
        .ranking-list { list-style: none; padding: 0; }
        .ranking-list li { padding: 10px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
        .input-group { margin-bottom: 20px; display: flex; gap: 5px; }
    </style>
</head>
<body>

    <h2>🏆 명예의 전당</h2>
    
    <!-- 점수 입력란 -->
    <div class="input-group">
        <input type="text" id="playerName" placeholder="닉네임" />
        <input type="number" id="playerScore" placeholder="점수" />
        <button id="saveBtn">점수 등록</button>
    </div>

    <!-- 랭킹 출력란 -->
    <ul id="rankingBoard" class="ranking-list">
        <li>로딩 중...</li>
    </ul>

    <!-- Firebase SDK 로드 및 로직 (type="module" 필수) -->
    <script type="module">
        // 1. Firebase 모듈 가져오기 (CDN 방식)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } 
          from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. 내 Firebase 프로젝트 설정값 (Firebase 콘솔에서 복사해오세요)
        const firebaseConfig = {
            apiKey: "AIzaSyBfuTBYylXXVQZvuqtIOuyQqwRKli47pJI",
            authDomain: "pvefps.firebaseapp.com",
            projectId: "pvefps"
        };

        // 3. Firebase 초기화
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const saveBtn = document.getElementById('saveBtn');
        const rankingBoard = document.getElementById('rankingBoard');

        // 4. 점수 저장하기 (Create)
        saveBtn.addEventListener('click', async () => {
            const name = document.getElementById('playerName').value;
            const score = parseInt(document.getElementById('playerScore').value);

            if (!name || isNaN(score)) {
                alert("이름과 점수를 정확히 입력해주세요.");
                return;
            }

            try {
                // 'rankings'라는 컬렉션에 데이터 추가
                await addDoc(collection(db, "rankings"), {
                    name: name,
                    score: score,
                    timestamp: new Date() // 등록 시간
                });
                alert("점수가 등록되었습니다!");
                loadRankings(); // 등록 후 랭킹 새로고침
            } catch (e) {
                console.error("저장 실패: ", e);
            }
        });

        // 5. 랭킹 불러오기 (Read)
        async function loadRankings() {
            try {
                rankingBoard.innerHTML = ""; // 기존 목록 초기화

                // 쿼리 작성: 'rankings' 컬렉션에서 score 내림차순(desc)으로 상위 10개만 가져오기
                const q = query(collection(db, "rankings"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q);

                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const li = document.createElement('li');
                    li.innerHTML = `<span><strong>${rank}위</strong> ${data.name}</span> <span>${data.score}점</span>`;
                    rankingBoard.appendChild(li);
                    rank++;
                });

                if (rankingBoard.innerHTML === "") {
                    rankingBoard.innerHTML = "<li>등록된 랭킹이 없습니다.</li>";
                }
            } catch (e) {
                console.error("불러오기 실패: ", e);
                rankingBoard.innerHTML = "<li>랭킹을 불러오지 못했습니다.</li>";
            }
        }

        // 6. 페이지 로드 시 랭킹 바로 보여주기
        loadRankings();
    </script>
</body>
</html>
